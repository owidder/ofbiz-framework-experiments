# OFBiz Sync Service Configuration
# =============================================================================
# This service consumes party snapshots from the compacted Kafka topic
# and syncs to OFBiz Derby database

spring:
  application:
    name: ofbiz-sync-service

  # OFBiz Derby Database (Network Server Mode)
  datasource:
    url: jdbc:derby://localhost:1527/ofbiz
    username: ofbiz
    password: ofbiz
    driver-class-name: org.apache.derby.jdbc.ClientDriver

  # Kafka Consumer Configuration
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: ofbiz-sync-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: true

# Logging Configuration
logging:
  level:
    root: INFO
    org.apache.ofbiz.sync: DEBUG
    org.springframework.kafka: INFO

# Application-Specific Configuration
ofbiz-sync:
  kafka:
    topics:
      party-entities: party.entities
  enabled: true
