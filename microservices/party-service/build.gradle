plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.1'
    id 'io.spring.dependency-management' version '1.1.4'
}

group = 'org.apache.ofbiz.microservices'
version = '1.0.0-SNAPSHOT'
sourceCompatibility = '17'

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot Starters
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    
    // Database
    implementation 'org.postgresql:postgresql'
    runtimeOnly 'com.h2database:h2' // For testing
    
    // Database Migration
    implementation 'org.flywaydb:flyway-core:10.4.1'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql:10.4.1'
    
    // Redis Cache
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    
    // Kafka (optional for event-driven communication)
    implementation 'org.springframework.kafka:spring-kafka'
    
    // OpenAPI Documentation
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.3.0'
    
    // MapStruct for DTO mapping
    implementation 'org.mapstruct:mapstruct:1.5.5.Final'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'
    
    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
    
    // Micrometer for metrics
    implementation 'io.micrometer:micrometer-registry-prometheus'
    
    // Optional: OFBiz Integration (for Dual-Write phase)
    // Uncomment when needed for integration
    // compileOnly project(':framework:entity')
    // compileOnly project(':framework:service')
    
    // Development Tools
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    
    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.kafka:spring-kafka-test'
    
    // Testcontainers for integration tests
    testImplementation 'org.testcontainers:testcontainers:1.19.3'
    testImplementation 'org.testcontainers:postgresql:1.19.3'
    testImplementation 'org.testcontainers:junit-jupiter:1.19.3'
    
    // REST Assured for API testing
    testImplementation 'io.rest-assured:rest-assured:5.4.0'
}

tasks.named('test') {
    useJUnitPlatform()
}

// Spring Boot Configuration
springBoot {
    mainClass = 'org.apache.ofbiz.party.microservice.PartyServiceApplication'
    buildInfo()
}

// Create executable JAR
bootJar {
    archiveBaseName = 'party-service'
    archiveVersion = version
    enabled = true
}

// Disable plain JAR (we only want the executable JAR)
jar {
    enabled = false
}

// Java Compiler Options
tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.compilerArgs += [
        '-parameters', // Keep parameter names for Spring
        '-Xlint:unchecked',
        '-Xlint:deprecation'
    ]
}

// Test Configuration
test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
    }
}

// Integration Test Task (optional)
task integrationTest(type: Test) {
    description = 'Runs integration tests'
    group = 'verification'
    
    useJUnitPlatform {
        includeTags 'integration'
    }
    
    shouldRunAfter test
}

// E2E Test Task (optional)
task e2eTest(type: Test) {
    description = 'Runs end-to-end tests'
    group = 'verification'
    
    useJUnitPlatform {
        includeTags 'e2e'
    }
    
    shouldRunAfter integrationTest
}

// Custom task to run all tests
task allTests {
    description = 'Runs all tests (unit, integration, e2e)'
    group = 'verification'
    
    dependsOn test, integrationTest, e2eTest
}
