# Party Service - Test Profile Configuration
# =============================================================================
# This profile is used for automated testing

spring:
  # Database Configuration (H2 in-memory for tests)
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password: 
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 2
  
  # JPA Configuration
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        generate_statistics: false
  
  # Flyway Configuration
  flyway:
    enabled: false  # Disabled for test profile
  
  # Cache Configuration (Simple in-memory cache for tests)
  cache:
    type: simple
  
  # Redis Configuration (disabled for tests)
  data:
    redis:
      host: localhost
      port: 6379
  
  # Kafka Configuration (disabled for tests)
  kafka:
    bootstrap-servers: localhost:9092

# Server Configuration
server:
  port: 0  # Random port for tests

# Management & Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# Logging Configuration
logging:
  level:
    root: WARN
    org.apache.ofbiz.party: DEBUG
    org.springframework.web: WARN
    org.springframework.data: WARN
    org.hibernate.SQL: WARN
    org.springframework.test: INFO
    org.testcontainers: INFO

# OpenAPI / Swagger Configuration
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

# Application-Specific Configuration
party-service:
  # Feature Flags (all disabled for unit tests)
  features:
    dual-write-enabled: false
    ofbiz-integration-enabled: false
    event-publishing-enabled: false
  
  # OFBiz Integration
  ofbiz:
    base-url: http://localhost:8080
    timeout: 1000
  
  # Test-specific settings
  test:
    use-testcontainers: false  # Set to true for integration tests
    cleanup-after-test: true
